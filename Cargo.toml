[package]
name = "serapendiya"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Serapendiya G0 foundation"

[lib]
name = "serapendiya"
path = "src/lib.rs"

[[bin]]
name = "streamd"
path = "src/bin/streamd.rs"

[[bin]]
name = "streamctl"
path = "src/bin/streamctl.rs"

[dependencies]
crc32c = "=0.6.9"
clap = { version = "4.5.51", features = ["derive"] }
rustix = { version = "=1.1.6", features = ["fs"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
toml = "0.9.8"
