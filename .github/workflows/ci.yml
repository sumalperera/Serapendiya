name: CI

on:
  push:
  pull_request:

jobs:
  g0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: cargo build --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: python3 scripts/adr024-journal-recovery-oracle.py
      - name: Verify journal review fixtures
        run: |
          python3 scripts/adr024-journal-fixtures.py "$RUNNER_TEMP/adr024-journal-review"
          python3 scripts/adr024-journal-fixtures.py --verify "$RUNNER_TEMP/adr024-journal-review"
          ADR024_JOURNAL_FIXTURES="$RUNNER_TEMP/adr024-journal-review" cargo test --locked --test adr024_journal_fixture_review -- --ignored
      - run: cargo run --locked --bin streamd -- --version
      - run: cargo run --locked --bin streamctl -- --help
      - run: test -s docs/verification/PR01.md
      - run: test -s docs/verification/PR02.md
      - run: test -s docs/verification/PR03.md
      - run: test -s docs/verification/PR04.md
      - run: test -s docs/verification/PR05.md
      - run: test -s docs/verification/PR06.md
      - run: test -s docs/verification/PR07.md
      - run: test -s docs/verification/PR08.md
      - run: test -s docs/verification/PR09.md

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - run: cargo +1.85.0 test --locked --workspace

  linux-docker-g1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/run-g1-tests.sh
      - run: test -s docs/verification/PR10.md
      - run: test -s docs/verification/PR11.md
      - run: test -s docs/verification/G1.md
